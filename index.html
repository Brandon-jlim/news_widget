<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Market Brief · 미국 증시 뉴스</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="js/config.js"></script>
    <script defer src="widget-runtime.js"></script>
    <script defer src="js/translation-quality.js"></script>
    <script defer src="js/market-impact.js"></script>
    <script defer src="js/news-source.js"></script>
    <script defer src="js/news-context.js"></script>
    <script defer src="js/feed-health.js"></script>
    <script defer src="js/app.js"></script>
  </head>
  <body>
    <main class="overlay-shell">
      <section class="news-widget" id="news-widget" data-status="loading" data-edit-mode="false" data-view="panel" aria-label="미국 증시 뉴스">
        <div class="widget-topline">
          <p class="eyebrow"><span class="brand-mark" aria-hidden="true"></span>MARKET BRIEF</p>
          <div class="view-switch" role="group" aria-label="화면 크기">
            <button id="view-widget" type="button" aria-pressed="false">위젯</button>
            <button id="view-panel" type="button" aria-pressed="true">패널</button>
          </div>
        </div>
        <header class="widget-header">
          <div class="widget-header__main">
            <h1 class="widget-title" id="widget-title">미국 증시 뉴스</h1>
            <p class="widget-subtitle">시장의 흐름을 한눈에</p>
          </div>

          <div class="widget-actions">
            <div class="status-badge" id="status-badge" role="status">
              <span class="status-dot" aria-hidden="true"></span>
              <span id="status-text">불러오는 중</span>
            </div>
          </div>
        </header>

        <div class="world-clocks" aria-label="현재 한국 및 미국 동부 시각">
          <div class="clock-cell">
            <div class="clock-label"><span>한국 <b>KST</b></span><span id="clock-korea-date">--.--</span></div>
            <time class="clock-time" id="clock-korea">--:--:--</time>
          </div>
          <div class="clock-cell">
            <div class="clock-label"><span>뉴욕 <b id="clock-us-zone">ET</b></span><span id="clock-us-date">--.--</span></div>
            <time class="clock-time" id="clock-us">--:--:--</time>
          </div>
        </div>

        <nav class="feed-tabs" id="feed-tabs" role="tablist" aria-label="뉴스 소스 선택" hidden></nav>

        <div class="reader-toolbar">
          <label class="search-field"><span aria-hidden="true">⌕</span><input id="news-search" type="search" placeholder="뉴스·종목 검색" aria-label="현재 피드의 뉴스·종목 검색" autocomplete="off" /></label>
          <button class="toolbar-btn font-toggle" id="font-toggle" type="button" aria-label="글자 크기: 기본. 누르면 크게 표시">가＋</button>
          <button class="toolbar-btn" id="pause-toggle" type="button" aria-pressed="false" title="화면 목록만 고정합니다. 뉴스 수집은 계속됩니다.">읽기 고정</button>
        </div>
        <div class="list-heading">
          <span id="list-count">최신 뉴스</span>
          <div class="widget-action-row">
            <select class="type-filter" id="news-type" aria-label="뉴스 유형 필터">
              <option value="all">모든 유형</option>
              <option value="breaking">속보</option>
              <option value="important">주요 기사</option>
              <option value="economic">경제지표</option>
              <option value="earnings">실적·전망</option>
              <option value="analyst">투자의견</option>
              <option value="official">공식 발표</option>
              <option value="release">보도자료</option>
              <option value="analysis">분석·의견</option>
              <option value="recap">기보도</option>
              <option value="general">일반 뉴스</option>
            </select>
            <button class="text-btn" id="edit-toggle" type="button" aria-pressed="false">핀 관리</button>
            <button class="text-btn text-btn--muted" id="clear-pins" type="button" hidden>모두 해제</button>
          </div>
        </div>
        <button class="new-news-button" id="new-news" type="button" hidden aria-live="polite">최신 뉴스로 돌아가기 ↑</button>

        <div class="cards" id="news-list" role="tabpanel" aria-label="뉴스 목록" tabindex="0">
          <article class="news-card skeleton-card" aria-hidden="true">
            <div class="news-card__meta skeleton-line"></div>
            <div class="news-card__title skeleton-block"></div>
            <div class="news-card__title skeleton-block short"></div>
          </article>
          <article class="news-card skeleton-card" aria-hidden="true">
            <div class="news-card__meta skeleton-line"></div>
            <div class="news-card__title skeleton-block"></div>
            <div class="news-card__title skeleton-block short"></div>
          </article>
          <article class="news-card skeleton-card" aria-hidden="true">
            <div class="news-card__meta skeleton-line"></div>
            <div class="news-card__title skeleton-block"></div>
            <div class="news-card__title skeleton-block short"></div>
          </article>
        </div>

        <footer class="widget-footer">
          <span id="footer-text">피드 연결 확인 중…</span>
          <span class="footer-zone">KST</span>
        </footer>
      </section>
    </main>
  </body>
</html>
